name: Compilar APK Gratis San Jose (Expo 57)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar codigo de D-SANJOSE
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar y alinear paquetes de Expo 57
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix

      - name: 5. Generar carpeta Android nativa
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      - name: 6. Compilar APK Release con Gradle
        working-directory: ./android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace

      - name: 7. Subir APK Lista para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: APPSANJOSE-Oficial-Release-APK
          path: android/app/build/outputs/apk/release/*.apk